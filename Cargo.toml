[package]
name = "Ethereum"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = {version="3.1.9", features = ["derive"]}
ethers = { version = "2.0", features = ["legacy", "ws"] }
ethers-solc = { version = "2.0", default-features = false, features = ["project-util"] }
eyre = "0.6"
hex = "0.4"
tokio = { version = "1.17.0", features = ["full"] }
tracing = "0.1.34"
tracing-subscriber = "0.3.11"

[[bin]]
name = "transact"
path="src/simple_transactions.rs"


[[bin]]
name = "deploy"
path="src/contract_deploy.rs"